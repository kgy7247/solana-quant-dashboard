<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>diag</title>
<style>body{background:#111;color:#ddd;font:13px monospace;padding:16px;white-space:pre-wrap}</style>
</head><body><pre id="out">running…</pre>
<script>
const W = "CBg7bCawmBztNwC3wEf8HoxABzFqVzJ5wSvBwHhnWG5L";
const lines = [];
function log(s){ lines.push(s); document.getElementById("out").textContent = lines.join("\n"); }

async function post(label, url, body){
  try{
    const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 9000);
    const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), signal:ctrl.signal});
    clearTimeout(to);
    const t = await r.text();
    log(label + " → HTTP " + r.status + " | " + t.slice(0,160));
  }catch(e){ log(label + " → ERR " + e.name + ": " + e.message); }
}
async function get(label, url){
  try{
    const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 9000);
    const r = await fetch(url, {signal:ctrl.signal});
    clearTimeout(to);
    const t = await r.text();
    log(label + " → HTTP " + r.status + " | " + t.slice(0,160));
  }catch(e){ log(label + " → ERR " + e.name + ": " + e.message); }
}

const bal = {jsonrpc:"2.0", id:1, method:"getBalance", params:[W]};
log("origin: " + location.origin);
(async () => {
  await post("rpc mainnet-beta", "https://api.mainnet-beta.solana.com", bal);
  await post("rpc publicnode", "https://solana-rpc.publicnode.com", bal);
  await post("rpc drpc", "https://solana.drpc.org", bal);
  await post("rpc ankr", "https://rpc.ankr.com/solana", bal);
  await post("rpc solana.com", "https://solana.com/api/rpc", bal);
  await get("dex sol", "https://api.dexscreener.com/latest/dex/tokens/So11111111111111111111111111111111111111112");
  await get("jup v3", "https://lite-api.jup.ag/price/v3?ids=So11111111111111111111111111111111111111112");
  await get("coingecko", "https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd");
  log("done");
})();
</script></body></html>
